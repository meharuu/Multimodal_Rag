<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Query History</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2a37;
            --muted: #6b7280;
            --line: #e5e7eb;
            --primary: #2563eb;
            --primary-600: #1d4ed8;
            --chip: #eef2ff;
            --shadow: 0 10px 30px rgba(16, 24, 40, .08);
            --radius: 14px;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            background: var(--bg);
            color: var(--text);
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 34px 18px 40px;
        }

        /* Header */
        .title {
            font-size: 42px;
            letter-spacing: -0.02em;
            margin: 6px 0 10px;
            font-weight: 750;
            color: #1f2a37;
        }

        .subline {
            height: 1px;
            background: linear-gradient(90deg, rgba(229, 231, 235, 1), rgba(229, 231, 235, .2));
            margin: 14px 0 26px;
        }

        /* Toolbar */
        .toolbar {
            display: grid;
            grid-template-columns: 220px 360px 1fr;
            gap: 14px;
            align-items: center;
            margin-bottom: 18px;
        }

        .control {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: 0 1px 0 rgba(16, 24, 40, .02);
            display: flex;
            gap: 10px;
            align-items: center;
            min-height: 44px;
        }

        .control label {
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
        }

        select,
        input[type="text"],
        input[type="date"] {
            border: none;
            outline: none;
            font-size: 14px;
            width: 100%;
            background: transparent;
            color: var(--text);
        }

        .date-range {
            display: grid;
            grid-template-columns: 1fr 18px 1fr;
            gap: 8px;
            width: 100%;
            align-items: center;
        }

        .dash {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        .search {
            padding-right: 44px;
            position: relative;
        }

        .search svg {
            position: absolute;
            right: 14px;
            width: 18px;
            height: 18px;
            opacity: .55;
        }

        /* List cards */
        .list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 18px 16px;
        }

        .cardTop {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .qRow {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            min-width: min(720px, 100%);
            flex: 1;
        }

        .qIcon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #e8efff;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .qIcon svg {
            width: 18px;
            height: 18px;
            color: var(--primary)
        }

        .question {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.25;
            margin: 2px 0 6px;
        }

        .answer {
            font-size: 14.5px;
            color: #374151;
            line-height: 1.5;
            margin: 0 0 6px;
        }

        .answer em {
            font-style: italic
        }

        .metaRight {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--muted);
            font-size: 13px;
            margin-top: 6px;
            white-space: nowrap;
        }

        .metaRight .dot {
            opacity: .5
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #f3f4f6;
            border: 1px solid #eef0f3;
            color: #374151;
            font-weight: 600;
            font-size: 12.5px;
        }

        .tag svg {
            width: 15px;
            height: 15px;
            opacity: .75
        }

        .conf {
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12.5px;
            border: 1px solid transparent;
        }

        .high {
            background: #ecfdf5;
            color: #047857;
            border-color: #a7f3d0;
        }

        .med {
            background: #fff7ed;
            color: #9a3412;
            border-color: #fed7aa;
        }

        .low {
            background: #fef2f2;
            color: #b91c1c;
            border-color: #fecaca;
        }

        .cardBottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            flex-wrap: wrap;
        }

        .sources {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 13px;
        }

        .sources a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 650;
        }

        .sources a:hover {
            text-decoration: underline;
        }

        .btn {
            margin-left: auto;
            background: #eff6ff;
            color: var(--primary-600);
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 750;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform .05s ease, background .15s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover {
            background: #dbeafe;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        /* Pagination */
        .pager {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            padding: 10px 2px;
            color: var(--muted);
            font-size: 14px;
        }

        .pager a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 650;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
        }

        .pager a:hover {
            background: rgba(37, 99, 235, .08);
        }

        .pages {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .pageBtn {
            width: 36px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--card);
            display: grid;
            place-items: center;
            color: #374151;
            text-decoration: none;
            font-weight: 700;
        }

        .pageBtn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .pageBtn:hover {
            background: #f3f4f6;
        }

        .pageBtn.active:hover {
            background: var(--primary-600);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .toolbar {
                grid-template-columns: 1fr;
            }

            .metaRight {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .qRow {
                min-width: 0;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .pager {
                flex-wrap: wrap;
                gap: 10px;
            }

            .pages {
                order: 3;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="title">Query History</div>
        <div class="subline"></div>

        <div class="toolbar">
            <div class="control">
                <label for="modality">Filter by Modality:</label>
                <select id="modality">
                    <option>All</option>
                    <option>Video</option>
                    <option>Audio</option>
                    <option>Text</option>
                    <option>Video + Audio</option>
                    <option>Video + Text</option>
                    <option>Audio + Text</option>
                </select>
            </div>

            <div class="control">
                <label>Date:</label>
                <div class="date-range">
                    <input type="date" value="2024-04-12" />
                    <div class="dash">to</div>
                    <input type="date" value="2024-04-19" />
                </div>
            </div>

            <div class="control search">
                <input type="text" placeholder="Search queries..." />
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" />
                    <path d="M16.2 16.2 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </div>
        </div>

        <div id="historyList" class="list">
            <div class="card">
                <div class="answer">Loading history…</div>
            </div>
        </div>
    </div>
    <script>
        const listEl = document.getElementById('historyList');

        const confClass = (c) => {
            if (c >= 0.75) return 'high';
            if (c >= 0.4) return 'med';
            return 'low';
        };

        fetch('/history/data')
            .then(res => res.json())
            .then(({ items }) => {
                if (!items.length) {
                    listEl.innerHTML = '<div class="card"><div class="answer">No history yet.</div></div>';
                    return;
                }
                listEl.innerHTML = '';
                items.slice().reverse().forEach(item => {
                    const conf = item.confidence ?? 0;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="cardTop">
                            <div class="qRow">
                                <div class="qIcon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none">
                                        <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" />
                                        <path d="M16.2 16.2 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                    </svg>
                                </div>
                                <div>
                                    <div class="question">${item.filename || 'Audio file'}</div>
                                    <p class="answer"><strong>Emotion:</strong> ${item.emotion || '--'}</p>
                                    <p class="answer"><strong>Transcript:</strong> ${item.transcript ? item.transcript.slice(0, 220) + (item.transcript.length > 220 ? '…' : '') : 'n/a'}</p>
                                </div>
                            </div>

                            <div class="metaRight">
                                <span class="tag">Audio</span>
                                <span class="conf ${confClass(conf)}">Confidence: ${conf ? (conf * 100).toFixed(1) + '%' : '--'}</span>
                                <span class="dot">•</span>
                                <span>${new Date(item.timestamp || Date.now()).toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                    listEl.appendChild(card);
                });
            })
            .catch(err => {
                listEl.innerHTML = `<div class="card"><div class="answer">Failed to load history: ${err.message}</div></div>`;
            });
    </script>
</body>

</html>
