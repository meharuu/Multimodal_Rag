<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feedback — Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d17;
      --card: #0f172a;
      --accent: #7c3aed;
      --text: #e7eefc;
      --muted: rgba(231, 238, 252, .65);
      --border: rgba(255, 255, 255, .12);
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(124, 58, 237, .15), transparent 35%), radial-gradient(circle at 80% 0%, rgba(59, 130, 246, .12), transparent 30%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 40px;
    }

    .shell {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background: rgba(124, 58, 237, .18);
      color: var(--text);
      border: 1px solid rgba(124, 58, 237, .45);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(124, 58, 237, .18);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .25);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .message {
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .rating {
      letter-spacing: 1px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 0;
    }

    a {
      color: var(--text);
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <div>
        <h1>All Feedback</h1>
        <div class="status" id="status">Loading…</div>
      </div>
      <div class="actions">
        <a href="/feedback" class="pill">← Submit Feedback</a>
        <button id="refreshBtn">Refresh</button>
      </div>
    </header>

    <div id="list" class="grid" aria-live="polite"></div>
  </div>

  <script>
    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const refreshBtn = document.getElementById("refreshBtn");

    const stars = (n) => "★".repeat(n) + "☆".repeat(5 - n);

    function render(items) {
      if (!items.length) {
        listEl.innerHTML = `<div class="empty">No feedback yet. Be the first to leave a note.</div>`;
        return;
      }

      listEl.innerHTML = items
        .map(
          (item) => `<article class="card">
            <div class="meta">
              <div class="pill">${stars(item.rating)} · ${item.rating}/5</div>
              <div>${new Date(item.created_at).toLocaleString()}</div>
            </div>
            <div class="message">${item.message.replace(/</g, "&lt;")}</div>
            <div class="meta">
              <div>${item.name || "Anonymous"}</div>
              <div>${item.email || ""}</div>
            </div>
          </article>`
        )
        .join("");
    }

    async function loadFeedback() {
      statusEl.textContent = "Loading…";
      refreshBtn.disabled = true;
      try {
        const res = await fetch("/api/feedback");
        if (!res.ok) throw new Error(`Request failed (${res.status})`);
        const data = await res.json();
        render(data.items || []);
        statusEl.textContent = `Loaded ${data.items?.length || 0} entries`;
      } catch (err) {
        statusEl.textContent = "Could not load feedback. Try again.";
        listEl.innerHTML = `<div class=\"empty\">${err.message}</div>`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", loadFeedback);
    loadFeedback();
  </script>
</body>

</html>
