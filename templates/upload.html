{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Upload a Video</h1>
<form method="POST" action="/upload" enctype="multipart/form-data">
<input type="file" name="video" required>
<button class="bg-blue-600 text-white px-4 py-2 ml-2">Upload</button>
</form>
{% endblock %}
